# Continuous integration for Agent Control Plane.
#
# Type-checks, builds, and runs the API's unit-test suite on every push and pull
# request targeting `main`. The unit tests are pure (no database, no network),
# so this workflow deliberately runs no service containers (e.g. no Postgres).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      # Check out the repository.
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 (matches .nvmrc and the root package.json `engines` field), with
      # npm's cache keyed off the lockfile for faster installs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install exactly what the lockfile pins, across all npm workspaces.
      - name: Install dependencies
        run: npm ci

      # Generate the Prisma client so the API's TypeScript type-checks and builds.
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # Type-check both apps without emitting any output.
      - name: Type-check API
        run: npx tsc -p apps/api/tsconfig.json --noEmit
      - name: Type-check web
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      # Build both apps (nest build + next build). Neither step needs a database:
      # the web app reads NEXT_PUBLIC_API_URL at runtime, not at build time.
      - name: Build
        run: npm run build

      # Run the API's unit-test suite (Jest + ts-jest).
      - name: Test (API)
        run: npm run test -w @acp/api

  integration-test:
    name: Integration (e2e) tests
    runs-on: ubuntu-latest

    # A throwaway Postgres for the e2e suite, which drives the real Nest app
    # against a real database (guards, validation, tenant context, run engine).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acp
          POSTGRES_PASSWORD: acp
          POSTGRES_DB: acp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://acp:acp@localhost:5432/acp_test?schema=public
      # Strong, non-placeholder secrets so the app boots under assertSecureConfig.
      AUTH_SECRET: ci-e2e-auth-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ENCRYPTION_KEY: ci-e2e-encryption-key-bbbbbbbbbbbbbbbbbbbbbbbbbbbb
      # Exercise the full loop offline — no real provider key or GitHub token.
      AI_MOCK: '1'
      GITHUB_MOCK: '1'
      WEBHOOK_ALLOW_PRIVATE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # Apply the versioned migrations to the throwaway database — the same
      # command production runs (see DEPLOYMENT.md). This exercises the
      # migration history on every CI run.
      - name: Apply migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      # Reconcile the schema afterwards. This is a no-op when the migrations are
      # current, and keeps the quick `db push` prototyping flow from ever
      # blocking CI if a schema edit has not been turned into a migration yet.
      - name: Push database schema
        run: npx prisma db push --schema apps/api/prisma/schema.prisma

      - name: Test (API e2e)
        run: npm run test:e2e -w @acp/api

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest

    # The browser E2E drives the real web UI, which proxies /api/* to a real API
    # backed by a throwaway Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acp
          POSTGRES_PASSWORD: acp
          POSTGRES_DB: acp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://acp:acp@localhost:5432/acp_test?schema=public
      AUTH_SECRET: ci-e2e-auth-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ENCRYPTION_KEY: ci-e2e-encryption-key-bbbbbbbbbbbbbbbbbbbbbbbbbbbb
      AI_MOCK: '1'
      GITHUB_MOCK: '1'
      WEBHOOK_ALLOW_PRIVATE: '1'
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # Apply versioned migrations (production path), then reconcile the schema
      # — a no-op when migrations are current (see the integration job above).
      - name: Apply migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Push database schema
        run: npx prisma db push --schema apps/api/prisma/schema.prisma

      # Build both apps so the API runs from dist and the web from `next start`.
      - name: Build
        run: npm run build

      # Download the matching Chromium (+ OS libs). This runner has no
      # pre-installed browser, so the config falls back to this managed one.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start servers and run Playwright
        run: |
          set -e
          node apps/api/dist/main.js > /tmp/acp-api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health >/dev/null && break; sleep 1; done
          (cd apps/web && npx next start -p 3000 > /tmp/acp-web.log 2>&1 &)
          for i in $(seq 1 40); do curl -sf http://localhost:3000/login >/dev/null && break; sleep 1; done
          npm run test:e2e -w @acp/web

      - name: Server logs on failure
        if: failure()
        run: |
          echo '--- API ---'; tail -n 100 /tmp/acp-api.log || true
          echo '--- WEB ---'; tail -n 100 /tmp/acp-web.log || true

  rls-enforcement:
    name: RLS enforcement (non-superuser role)
    runs-on: ubuntu-latest

    # Proves tenant isolation is actually ENFORCED at the database (DB_RLS=1):
    # the owner installs the schema + policies + app role, then the whole e2e
    # suite runs as that NON-superuser role. Every request sets its org GUC via
    # the client extension, so same-tenant work succeeds while the database
    # refuses cross-tenant rows. See docs/RLS.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acp
          POSTGRES_PASSWORD: acp
          POSTGRES_DB: acp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Job-level DATABASE_URL is the privileged OWNER connection, used for the
    # setup steps (migrate / RLS / role). The test step overrides it with the
    # restricted app role.
    env:
      DATABASE_URL: postgresql://acp:acp@localhost:5432/acp_test?schema=public
      AUTH_SECRET: ci-e2e-auth-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ENCRYPTION_KEY: ci-e2e-encryption-key-bbbbbbbbbbbbbbbbbbbbbbbbbbbb
      AI_MOCK: '1'
      GITHUB_MOCK: '1'
      WEBHOOK_ALLOW_PRIVATE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # Owner installs the schema and the RLS policies (ALTER TABLE needs the owner).
      - name: Apply migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Install RLS policies
        run: npm run db:rls -w @acp/api

      # Owner creates the restricted (NOSUPERUSER NOBYPASSRLS) application role.
      - name: Provision application role
        env:
          APP_DB_USER: acp_app
          APP_DB_PASSWORD: acp_app_ci_pw
        run: npm run db:rls-role -w @acp/api

      # Run the whole suite AS the restricted role with enforcement on. The
      # suite's beforeAll tolerates not being able to (re)install RLS as a
      # non-owner, and the raw-SQL policy probe is skipped under DB_RLS=1.
      - name: Test (API e2e, enforced)
        env:
          DATABASE_URL: postgresql://acp_app:acp_app_ci_pw@localhost:5432/acp_test?schema=public
          DB_RLS: '1'
        run: npm run test:e2e -w @acp/api
